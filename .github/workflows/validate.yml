name: Validate plugin

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # SolidWorks only runs on Windows, and some tests (PowerShell's curl
        # alias, the cp1252 feedback path) only run there.
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.9"
          - "3.13"
        # Python 3.9 builds are unavailable for Ubuntu 26.04.
        exclude:
          - os: ubuntu-latest
            python-version: "3.9"
        include:
          - os: ubuntu-24.04
            python-version: "3.9"

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run structural and runtime checks
        run: python plugins/solidworks-gpt-plugin/scripts/run_checks.py

      - name: Validate versioned installed-bundle layout
        run: python scripts/validate_installed_bundle.py
